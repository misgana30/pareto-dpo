[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pareto-dpo"
version = "0.1.0"
description = "Pareto-DPO: Multi-Objective Preference Alignment for Scaffold Decoration"
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "rdkit>=2022.9",
    "numpy>=1.24",
    "tqdm>=4.65",
    "wandb>=0.15",
    "datasets>=2.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black>=23.0", "ruff>=0.1"]
